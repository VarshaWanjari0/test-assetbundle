name: Build recovered mods (2021 baseline)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    name: Recovered ${{ matrix.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        kind: [Truck, Prop]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Android AssetBundle
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: Recovered/${{ matrix.kind }}
          unityVersion: 2021.3.43f1
          targetPlatform: Android
          versioning: None
          buildMethod: ModBundleBuilder.BuildFromCommandLine
          customParameters: -modOutput /github/workspace/recovered-build/${{ matrix.kind }}.glb
      - name: Inspect built bundle
        run: |
          python3 -m pip install --quiet 'UnityPy==1.25.0'
          python3 .github/scripts/validate-recovered.py "recovered-build/${{ matrix.kind }}.glb" "${{ matrix.kind }}"
      - name: Zip exact built project
        env:
          KIND: ${{ matrix.kind }}
        run: |
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          kind = os.environ['KIND']
          root = Path('Recovered') / kind
          out = Path('recovered-build') / (kind + '-Unity-project.zip')
          excluded = {'Library', 'Temp', 'Obj', 'Build', 'Builds', 'Logs', 'UserSettings', 'MemoryCaptures'}
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and not any(p in excluded for p in path.relative_to(root).parts):
                      z.write(path, arcname=path.relative_to(root))
          print('Created', out, out.stat().st_size, 'bytes')
          PY
      - name: Upload project and bundle
        uses: actions/upload-artifact@v4
        with:
          name: recovered-${{ matrix.kind }}-2021
          path: |
            recovered-build/${{ matrix.kind }}.glb
            recovered-build/${{ matrix.kind }}-Unity-project.zip
          if-no-files-found: error
          retention-days: 14

name: Build AssetBundle

on:
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: 'Target Platform'
        required: true
        default: 'Android'
        type: choice
        options:
          - Android
          - StandaloneWindows64
          - StandaloneLinux64

jobs:
  build:
    name: Build AssetBundles
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space & Optimize Docker
        run: |
          echo "Disk space before cleanup:"
          df -h /

          # Parallel fast cleanup of largest bloated directories
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc &

          # Maximize concurrent layer downloads for Docker (speeds up GameCI pull)
          sudo mkdir -p /etc/docker
          echo '{"max-concurrent-downloads": 10}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker &

          wait
          echo "Disk space after cleanup:"
          df -h /

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Test/Library
          key: Library-${{ hashFiles('Test/Assets/**', 'Test/Packages/**', 'Test/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Configure Target Platform
        run: |
          TARGET="${{ inputs.targetPlatform }}"

          if [ -z "$TARGET" ]; then
            TARGET="Android"
          fi

          echo "Selected Target Platform: $TARGET"
          echo "TARGET_PLATFORM=$TARGET" >> "$GITHUB_ENV"

      - name: Check Unity Secrets
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_EMAIL" ]; then
            echo "UNITY_EMAIL: SET"
          else
            echo "UNITY_EMAIL: MISSING"
          fi

          if [ -n "$UNITY_PASSWORD" ]; then
            echo "UNITY_PASSWORD: SET"
          else
            echo "UNITY_PASSWORD: MISSING"
          fi

          if [ -n "$UNITY_LICENSE" ]; then
            echo "UNITY_LICENSE: SET"
            echo "UNITY_LICENSE length: ${#UNITY_LICENSE}"
          else
            echo "UNITY_LICENSE: MISSING"
          fi

      - name: Build AssetBundles with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: Test
          unityVersion: 2021.3.43f1
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          versioning: None
          buildMethod: BuildAssetBundles.BuildAllBundles

      - name: Upload Built AssetBundles
        uses: actions/upload-artifact@v4
        with:
          name: AssetBundles-${{ env.TARGET_PLATFORM }}
          path: |
            Test/Assets/AssetBundles/
            Test/Builds/
          if-no-files-found: warn

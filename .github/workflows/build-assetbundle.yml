name: Build AssetBundle

on:
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: 'Target Platform'
        required: true
        default: 'Android'
        type: choice
        options:
          - Android
          - StandaloneWindows64
          - StandaloneLinux64

jobs:
  build:
    name: Build AssetBundles
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "Disk space after cleanup:"
          df -h /

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Target Platform
        run: |
          TARGET="${{ inputs.targetPlatform }}"
          if [ -z "$TARGET" ]; then
            TARGET="Android"
          fi
          echo "Selected Target Platform: $TARGET"
          echo "TARGET_PLATFORM=$TARGET" >> $GITHUB_ENV

      - name: Configure Unity License
        run: |
          if [ -n "${{ secrets.UNITY_LICENSE }}" ]; then
            echo "Using license from repository secret UNITY_LICENSE."
            echo "UNITY_LICENSE<<UNITY_LICENSE_EOF" >> $GITHUB_ENV
            echo "${{ secrets.UNITY_LICENSE }}" >> $GITHUB_ENV
            echo "" >> $GITHUB_ENV
            echo "UNITY_LICENSE_EOF" >> $GITHUB_ENV
          elif [ -f "Unity_lic.ulf" ]; then
            echo "Using license from repository file Unity_lic.ulf."
            echo "UNITY_LICENSE<<UNITY_LICENSE_EOF" >> $GITHUB_ENV
            cat Unity_lic.ulf >> $GITHUB_ENV
            echo "" >> $GITHUB_ENV
            echo "UNITY_LICENSE_EOF" >> $GITHUB_ENV
          elif [ -f "Test/Unity_lic.ulf" ]; then
            echo "Using license from Test/Unity_lic.ulf."
            echo "UNITY_LICENSE<<UNITY_LICENSE_EOF" >> $GITHUB_ENV
            cat Test/Unity_lic.ulf >> $GITHUB_ENV
            echo "" >> $GITHUB_ENV
            echo "UNITY_LICENSE_EOF" >> $GITHUB_ENV
          else
            echo "::error::No Unity license found!"
            exit 1
          fi

      - name: Build AssetBundles with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
        with:
          projectPath: Test
          unityVersion: 2021.3.43f1
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          buildMethod: BuildAssetBundles.BuildAllBundles

      - name: Upload Built AssetBundles
        uses: actions/upload-artifact@v4
        with:
          name: AssetBundles-${{ env.TARGET_PLATFORM }}
          path: Test/Assets/AssetBundles/
          if-no-files-found: warn

name: Build AssetBundle

on:
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: 'Target Platform'
        required: true
        default: 'Android'
        type: choice
        options:
          - Android
          - StandaloneWindows64
          - StandaloneLinux64

jobs:
  build:
    name: Build AssetBundles
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "Disk space after cleanup:"
          df -h /

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Test/Library
          key: Library-${{ hashFiles('Test/Assets/**', 'Test/Packages/**', 'Test/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Configure Target Platform
        run: |
          TARGET="${{ inputs.targetPlatform }}"
          if [ -z "$TARGET" ]; then
            TARGET="Android"
          fi
          echo "Selected Target Platform: $TARGET"
          echo "TARGET_PLATFORM=$TARGET" >> $GITHUB_ENV

      - name: Build AssetBundles with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: Test
          unityVersion: 2021.3.43f1
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          buildMethod: BuildAssetBundles.BuildAllBundles

      - name: Upload Built AssetBundles
        uses: actions/upload-artifact@v4
        with:
          name: AssetBundles-${{ env.TARGET_PLATFORM }}
          path: Test/Assets/AssetBundles/
          if-no-files-found: warn

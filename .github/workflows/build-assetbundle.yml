name: Build AssetBundles

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: 'Target Platform'
        required: true
        default: 'Android'
        type: choice
        options:
          - Android
          - StandaloneWindows64
          - StandaloneLinux64

jobs:
  build:
    name: Build AssetBundle (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [Prop]

    steps:
      - name: Free Disk Space, Enable Swap & Optimize Docker
        run: |
          df -h /
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc &
          sudo mkdir -p /etc/docker
          echo '{"max-concurrent-downloads": 10}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker &
          wait
          # Create 10GB swap space to eliminate OOM (exit code 137)
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Target Platform
        run: |
          TARGET="${{ inputs.targetPlatform }}"
          if [ -z "$TARGET" ]; then
            TARGET="Android"
          fi
          echo "Selected Target Platform: $TARGET"
          echo "TARGET_PLATFORM=$TARGET" >> "$GITHUB_ENV"

      - name: Inject Build Script
        run: |
          mkdir -p ${{ matrix.project }}/ExportedProject/Assets/Editor
          cp ci/BuildAssetBundles.cs ${{ matrix.project }}/ExportedProject/Assets/Editor/BuildAssetBundles.cs

      - name: Build AssetBundles with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ matrix.project }}/ExportedProject
          unityVersion: 2021.3.43f1
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          versioning: None
          buildMethod: BuildAssetBundles.BuildAllBundles

      - name: Upload Built AssetBundles
        uses: actions/upload-artifact@v4
        with:
          name: AssetBundles-${{ matrix.project }}-${{ env.TARGET_PLATFORM }}
          path: ${{ matrix.project }}/ExportedProject/Assets/AssetBundles/
          if-no-files-found: warn

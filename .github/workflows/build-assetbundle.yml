name: Build AssetBundles

on:
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: 'Target Platform'
        required: true
        default: 'Android'
        type: choice
        options:
          - Android
          - StandaloneWindows64
          - StandaloneLinux64

jobs:
  build:
    name: Build AssetBundle (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [Truck, Prop]

    steps:
      - name: Free Disk Space & Optimize Docker
        run: |
          echo "Disk space before cleanup:"
          df -h /

          # Parallel fast cleanup of largest bloated directories
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc &

          # Maximize concurrent layer downloads for Docker
          sudo mkdir -p /etc/docker
          echo '{"max-concurrent-downloads": 10}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker &

          wait
          echo "Disk space after cleanup:"
          df -h /

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Target Platform
        run: |
          TARGET="${{ inputs.targetPlatform }}"
          if [ -z "$TARGET" ]; then
            TARGET="Android"
          fi
          echo "Selected Target Platform: $TARGET"
          echo "TARGET_PLATFORM=$TARGET" >> "$GITHUB_ENV"

      - name: Setup Build Script
        run: |
          mkdir -p ${{ matrix.project }}/ExportedProject/Assets/Editor
          cat << 'END_SCRIPT' > ${{ matrix.project }}/ExportedProject/Assets/Editor/BuildAssetBundles.cs
using System;
using System.IO;
using UnityEditor;
using UnityEngine;

public class BuildAssetBundles
{
    [MenuItem("Build/Build AssetBundles")]
    public static void BuildAllBundles()
    {
        string assetBundleDirectory = Path.Combine("Assets", "AssetBundles");
        if (!Directory.Exists(assetBundleDirectory)) Directory.CreateDirectory(assetBundleDirectory);

        BuildTarget target = EditorUserBuildSettings.activeBuildTarget;
        string[] args = Environment.GetCommandLineArgs();
        for (int i = 0; i < args.Length; i++)
        {
            if (args[i].Equals("-buildTarget", StringComparison.OrdinalIgnoreCase) && i + 1 < args.Length)
            {
                if (Enum.TryParse(args[i + 1], true, out BuildTarget parsedTarget))
                {
                    target = parsedTarget;
                }
                break;
            }
        }

        Debug.Log("[BuildAssetBundles] Building AssetBundles for target: " + target);
        AssetBundleManifest manifest = BuildPipeline.BuildAssetBundles(
            assetBundleDirectory,
            BuildAssetBundleOptions.None,
            target
        );

        if (manifest == null) throw new Exception("[BuildAssetBundles] Build failed or returned null manifest.");

        Debug.Log("[BuildAssetBundles] Successfully generated bundles:");
        foreach (string b in manifest.GetAllAssetBundles())
        {
            Debug.Log("  - " + b);
        }
    }
}

END_SCRIPT

      - name: Build AssetBundles with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ matrix.project }}/ExportedProject
          unityVersion: 2021.3.43f1
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          versioning: None
          buildMethod: BuildAssetBundles.BuildAllBundles

      - name: Upload Built AssetBundles
        uses: actions/upload-artifact@v4
        with:
          name: AssetBundles-${{ matrix.project }}-${{ env.TARGET_PLATFORM }}
          path: ${{ matrix.project }}/ExportedProject/Assets/AssetBundles/
          if-no-files-found: warn

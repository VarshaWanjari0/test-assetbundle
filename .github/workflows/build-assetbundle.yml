name: Build AssetBundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: 'Target Platform'
        required: true
        default: 'Android'
        type: choice
        options:
          - Android
          - StandaloneWindows64
          - StandaloneLinux64

jobs:
  build:
    name: Build AssetBundles
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2021.3.43f1-android-3.2.2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Activate Unity License
        run: |
          mkdir -p /root/.local/share/unity3d/Unity/
          if [ -f "Unity_lic.ulf" ]; then
            cp Unity_lic.ulf /root/.local/share/unity3d/Unity/Unity_lic.ulf
            echo "Installed license from Unity_lic.ulf"
          elif [ -f "Test/Unity_lic.ulf" ]; then
            cp Test/Unity_lic.ulf /root/.local/share/unity3d/Unity/Unity_lic.ulf
            echo "Installed license from Test/Unity_lic.ulf"
          else
            echo "No license file found!"
            exit 1
          fi

      - name: Build AssetBundles
        run: |
          unity-editor \
            -quit \
            -batchmode \
            -nographics \
            -silent-crashes \
            -projectPath ./Test \
            -buildTarget ${{ github.event.inputs.targetPlatform || 'Android' }} \
            -executeMethod BuildAssetBundles.BuildAllBundles \
            -logFile /dev/stdout

      - name: Upload Built AssetBundles
        uses: actions/upload-artifact@v4
        with:
          name: AssetBundles-${{ github.event.inputs.targetPlatform || 'Android' }}
          path: Test/Assets/AssetBundles/
